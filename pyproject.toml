[project]
name = "careorbit"
version = "0.3.0"
description = "CareOrbit — Healthcare AI Platform for Indian Patients"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic>=2.12.5",
    "pyjwt>=2.11.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.41.0",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "phase2: Phase 2 features (not in Phase 1 MVP)",
    "phase3: Phase 3 features (payment, ML models)",
    "demo_only: Demo mode only (requires demo routes registered)",
    "slow: Slow tests (>5s, often algorithm-level or real DB)",
    "critical: Critical safety tests — must pass before any deployment",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
