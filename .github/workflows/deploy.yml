name: CareOrbit Deploy Pipeline

on:
  push:
    branches: [develop, dev, release, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  AZURE_RG: careorbit-rg
  AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS_JSON }}
  AZURE_SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_SWA_DEPLOY_TOKEN }}

jobs:
  test:
    name: Pre-deploy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./careorbit_test.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"].get("dependencies", [])

          # Install runtime deps directly from pyproject without building the project package.
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps, "pytest", "pytest-asyncio", "httpx"])
          PY

      - name: Prepare test report directory
        run: mkdir -p artifacts/test-results

      - name: Run safety tests
        run: pytest tests/false_positive_negative/ -m critical -v --tb=long -x --junitxml=artifacts/test-results/safety.xml

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x -m "not deployment" --junitxml=artifacts/test-results/unit.xml

      - name: Run architecture compliance tests
        run: pytest -q tests/functional/test_api_architecture_compliance.py --junitxml=artifacts/test-results/architecture-compliance.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: artifacts/test-results/
          retention-days: 7

  build-backend-artifact:
    name: Build Backend Artifact
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create backend deploy package
        run: |
          zip -r backend-package.zip . \
            -x ".git/*" \
               ".github/*" \
               "client/*" \
               "node_modules/*" \
               ".venv/*" \
               "__pycache__/*" \
               "*.pyc" \
               "tests/*"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-package.zip
          retention-days: 1

  deploy-dev:
    name: Deploy to Dev
    needs: [test, build-backend-artifact]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Validate Azure credentials presence
        run: |
          if [ -z "$AZURE_CREDENTIALS_JSON" ]; then
            echo "AZURE_CREDENTIALS_JSON is empty. Set it before running deployments." >&2
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS_JSON }}

      - name: Deploy to Dev App Service (attempt 1)
        id: deploy_dev_1
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: careorbit-api-dev
          package: backend-package.zip

      - name: Deploy to Dev App Service (attempt 2)
        id: deploy_dev_2
        if: steps.deploy_dev_1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: careorbit-api-dev
          package: backend-package.zip

      - name: Ensure Dev deployment succeeded
        if: steps.deploy_dev_1.outcome == 'failure' && steps.deploy_dev_2.outcome == 'failure'
        run: |
          echo "Dev App Service deployment failed after retry." >&2
          exit 1

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://careorbit-api-dev.azurewebsites.net/health; then
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 20
          done
          echo "Dev smoke test failed"
          exit 1

  deploy-release:
    name: Deploy to Release
    needs: [test, build-backend-artifact]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Validate Azure credentials presence
        run: |
          if [ -z "$AZURE_CREDENTIALS_JSON" ]; then
            echo "AZURE_CREDENTIALS_JSON is empty. Set it before running deployments." >&2
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS_JSON }}

      - name: Deploy to Release App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: careorbit-api-release
          package: backend-package.zip

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://careorbit-api-release.azurewebsites.net/health; then
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 20
          done
          echo "Release smoke test failed"
          exit 1

  deploy-production:
    name: Deploy to Production (Staging Slot Swap)
    needs: [test, build-backend-artifact]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Validate Azure credentials presence
        run: |
          if [ -z "$AZURE_CREDENTIALS_JSON" ]; then
            echo "AZURE_CREDENTIALS_JSON is empty. Set it before running deployments." >&2
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS_JSON }}

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: careorbit-api-prod
          slot-name: staging
          package: backend-package.zip

      - name: Smoke test staging slot
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://careorbit-api-prod-staging.azurewebsites.net/health; then
              exit 0
            fi
            echo "Staging health check attempt $i failed, retrying..."
            sleep 20
          done
          echo "Staging smoke test failed"
          exit 1

      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ env.AZURE_RG }} \
            --name careorbit-api-prod \
            --slot staging \
            --target-slot production

      - name: Verify production
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://careorbit-api-prod.azurewebsites.net/health; then
              exit 0
            fi
            echo "Production health check attempt $i failed, retrying..."
            sleep 20
          done
          echo "Production verification failed"
          exit 1

  deploy-frontend:
    name: Deploy Frontend (Static Web App)
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate SWA deploy token presence
        run: |
          if [ -z "$AZURE_SWA_DEPLOY_TOKEN" ]; then
            echo "AZURE_SWA_DEPLOY_TOKEN is empty. Set it before running frontend deployment." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build frontend
        run: |
          npm ci
          if [ "${GITHUB_REF}" = "refs/heads/dev" ] || [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            export VITE_API_BASE_URL=https://careorbit-api-dev.azurewebsites.net
          else
            export VITE_API_BASE_URL=https://careorbit-api-prod.azurewebsites.net
          fi

          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_SWA_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/public
          output_location: ""
          skip_app_build: true
