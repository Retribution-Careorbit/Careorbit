name: CareOrbit Deploy Pipeline

on:
  push:
    branches: [dev, release, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  AZURE_RG: careorbit-rg
  AZURE_LOCATION: southindia
  AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS_JSON }}
  AZURE_SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_SWA_DEPLOY_TOKEN }}

jobs:
  test:
    name: "Pre-deploy Tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careorbit_test
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: careorbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://careorbit_test:testpass123@localhost:5432/careorbit_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install .
          pip install pytest pytest-asyncio httpx
      - name: Run safety tests
        run: pytest tests/false_positive_negative/ -m critical -v --tb=long -x
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x -m "not deployment"

  build-backend-artifact:
    name: "Build Backend Artifact"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create backend deploy package
        run: |
          zip -r backend-package.zip . \
            -x ".git/*" \
               ".github/*" \
               "client/*" \
               "node_modules/*" \
               ".venv/*" \
               "__pycache__/*" \
               "*.pyc" \
               "tests/*"
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-package.zip

  deploy-dev:
    name: "Deploy to Dev"
    needs: [test, build-backend-artifact]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
      - uses: actions/checkout@v4
      - name: Validate Azure credentials presence
        run: |
          if [ -z "${{ env.AZURE_CREDENTIALS_JSON }}" ]; then
            echo "AZURE_CREDENTIALS_JSON is empty. Set it before running deployments." >&2
            exit 1
          fi
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS_JSON }}
      - name: Deploy to Dev App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: careorbit-api-dev
          package: backend-package.zip
      - name: Smoke test
        run: |
          sleep 15
          curl -f https://careorbit-api-dev.azurewebsites.net/health

  deploy-release:
    name: "Deploy to Release"
    needs: [test, build-backend-artifact]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
      - uses: actions/checkout@v4
      - name: Validate Azure credentials presence
        run: |
          if [ -z "${{ env.AZURE_CREDENTIALS_JSON }}" ]; then
            echo "AZURE_CREDENTIALS_JSON is empty. Set it before running deployments." >&2
            exit 1
          fi
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS_JSON }}
      - name: Deploy to Release App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: careorbit-api-release
          package: backend-package.zip
      - name: Smoke test
        run: |
          sleep 15
          curl -f https://careorbit-api-release.azurewebsites.net/health

  deploy-production:
    name: "Deploy to Production (Staging Slot Swap)"
    needs: [test, build-backend-artifact]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
      - uses: actions/checkout@v4
      - name: Validate Azure credentials presence
        run: |
          if [ -z "${{ env.AZURE_CREDENTIALS_JSON }}" ]; then
            echo "AZURE_CREDENTIALS_JSON is empty. Set it before running deployments." >&2
            exit 1
          fi
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS_JSON }}
      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: careorbit-api-prod
          slot-name: staging
          package: backend-package.zip
      - name: Smoke test staging slot
        run: |
          sleep 20
          curl -f https://careorbit-api-prod-staging.azurewebsites.net/health
      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ env.AZURE_RG }} \
            --name careorbit-api-prod \
            --slot staging \
            --target-slot production
      - name: Verify production
        run: |
          sleep 10
          curl -f https://careorbit-api-prod.azurewebsites.net/health

  deploy-frontend:
    name: "Deploy Frontend (Static Web App)"
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SWA deploy token presence
        run: |
          if [ -z "${{ env.AZURE_SWA_DEPLOY_TOKEN }}" ]; then
            echo "AZURE_SWA_DEPLOY_TOKEN is empty. Set it before running frontend deployment." >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install and build
        working-directory: client
        run: |
          npm ci
          VITE_API_BASE_URL=https://careorbit-api-prod.azurewebsites.net npm run build
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_SWA_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: client
          output_location: dist
          skip_app_build: true
